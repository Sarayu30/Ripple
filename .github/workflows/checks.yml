name: Ripple checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ripple_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: ripple_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ripple_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ripple_test:disposable_ci_password@localhost:5432/ripple_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Python dependencies and media tools
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts
      - name: Build and test browser flows
        run: |
          npm run build
          npm run test:ui
          npm run test:auth
          npm run test:deploy
          npm run test:auth-browser
          npm run test:browser
      - name: Test backend with disposable PostgreSQL
        run: python -m pytest -q --tb=short
      - name: Verify production Docker startup and assigned ports
        run: bash tests/docker-smoke.sh
